name: validation

on:
  pull_request:
    branches: [main, benchmark/direct, benchmark/pcp, benchmark/595-d1-direct, benchmark/595-d1-pcp]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact repository commit to validate (40 lowercase hex)
        required: true
        type: string

permissions:
  contents: read

jobs:
  fixture-validation:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:11.8
        env:
          MARIADB_DATABASE: db
          MARIADB_USER: db
          MARIADB_PASSWORD: db
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - name: Validate requested exact head
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - name: Prove actual checkout and toolchain provenance
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(sha256sum composer.lock | cut -d ' ' -f1)" = 3a3d086be59571b43f05301ab099dc4d710a2ca1da0b25af60341d527f531f2b
          git rev-parse HEAD
          git hash-object .github/workflows/validation.yml
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, pdo_mysql, xml, dom, zip, curl
          tools: composer:v2
          coverage: none
      - name: Record actual PHP, Composer and database versions
        run: |
          php --version
          composer --version
          php -r '$db = new PDO("mysql:host=127.0.0.1;port=3306;dbname=db", "db", "db"); echo $db->query("SELECT VERSION()")->fetchColumn(), PHP_EOL;'
      - name: Validate dependency manifest and lock
        run: composer validate --strict --no-interaction
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prove Drupal core and PHPUnit are installed
        run: |
          test -f web/core/tests/bootstrap.php
          test -x vendor/bin/phpunit
          test -x vendor/bin/phpcs
          test -f composer.lock
      - name: PHP syntax
        run: |
          test -n "$(find web/modules/custom/pcp_g0_fixture -type f -name '*.php' -print -quit)"
          find web/modules/custom/pcp_g0_fixture -type f -name '*.php' -print0 | xargs -0 -r -n1 php -l
      - name: Drupal coding standards
        run: vendor/bin/phpcs --standard=Drupal web/modules/custom/pcp_g0_fixture
      - name: Drupal Unit and Kernel tests
        env:
          SIMPLETEST_DB: mysql://db:db@127.0.0.1:3306/db
          SIMPLETEST_BASE_URL: http://127.0.0.1
          BROWSERTEST_OUTPUT_BASE_DIRECTORY: /tmp/pcp-g0-browser
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: |
          vendor/bin/phpunit -c web/core/phpunit.xml.dist --fail-on-empty-test-suite --fail-on-skipped --fail-on-incomplete --fail-on-risky web/modules/custom/pcp_g0_fixture/tests/src/Unit
          vendor/bin/phpunit -c web/core/phpunit.xml.dist --fail-on-empty-test-suite --fail-on-skipped --fail-on-incomplete --fail-on-risky web/modules/custom/pcp_g0_fixture/tests/src/Kernel
