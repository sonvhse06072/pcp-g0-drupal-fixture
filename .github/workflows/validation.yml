name: validation

on:
  pull_request:
    branches: [main, benchmark/direct, benchmark/pcp, benchmark/595-d1-direct, benchmark/595-d1-pcp]
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact reviewed candidate commit (40 lowercase hex characters)
        required: true
        type: string

permissions:
  contents: read

jobs:
  fixture-validation:
    runs-on: ubuntu-latest
    services:
      database:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: db
          MARIADB_USER: db
          MARIADB_PASSWORD: db
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=30
    steps:
      - name: Require an exact candidate before checkout
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
        shell: bash
        run: |
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
          persist-credentials: false
      - name: Prove the checked-out candidate
        env:
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || inputs.candidate_sha }}
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, pdo_mysql, xml, dom, zip, curl
          tools: composer:v2
          coverage: none
      - name: Validate dependency manifest and lock
        run: composer validate --strict --no-interaction
      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prove Drupal core and PHPUnit are installed
        run: |
          test -f web/core/tests/bootstrap.php
          test -x vendor/bin/phpunit
          test -x vendor/bin/phpcs
          test -f composer.lock
      - name: PHP syntax
        run: |
          php <<'PHP'
          <?php
          foreach(new RecursiveIteratorIterator(new RecursiveDirectoryIterator('web/modules/custom/pcp_g0_fixture')) as $f)if($f->isFile()&&$f->getExtension()==='php'){$p=proc_open([PHP_BINARY,'-l',$f->getPathname()],[STDIN,STDOUT,STDERR],$x);if(!is_resource($p)||proc_close($p))exit(1);}
          PHP
      - name: Drupal coding standards
        run: vendor/bin/phpcs --standard=Drupal web/modules/custom/pcp_g0_fixture
      - name: Drupal Unit and Kernel tests
        env:
          SIMPLETEST_DB: mysql://db:db@127.0.0.1:3306/db
          SIMPLETEST_BASE_URL: http://127.0.0.1
          BROWSERTEST_OUTPUT_BASE_DIRECTORY: /tmp/pcp-g0-browser
          SYMFONY_DEPRECATIONS_HELPER: disabled
        run: |
          vendor/bin/phpunit --fail-on-empty-test-suite --fail-on-skipped --fail-on-incomplete -c web/core/phpunit.xml.dist web/modules/custom/pcp_g0_fixture/tests/src/Unit
          vendor/bin/phpunit --fail-on-empty-test-suite --fail-on-skipped --fail-on-incomplete -c web/core/phpunit.xml.dist web/modules/custom/pcp_g0_fixture/tests/src/Kernel
